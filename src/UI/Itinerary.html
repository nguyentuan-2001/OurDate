<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"

    <title>Lịch trình gợi ý - Our Date</title>
    <!-- Tailwind CSS CDN v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                main: '#FF6F91',
                light: '#FFD6E5',
                cream: '#FFF1F5',
                wine: '#4A1D2B',
                burgundy: '#8B1E3F',
                accent: '#E04A74',
              },
            },
            fontFamily: {
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                '"SF Pro Text"',
                '"SF Pro Display"',
                'Roboto',
                'Helvetica',
                'Arial',
                'sans-serif',
              ],
            },
          },
        },
      };
    </script>
    <!-- BEGIN: Custom Styles -->
    <style data-purpose="base-layout">
      body {
        background-color: #f7e9ed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Hide scrollbars for clean mobile appearance */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <style data-purpose="timeline-connector">
      /* Vertical connecting line through timeline steps */
      .timeline-track::before {
        content: '';
        position: absolute;
        top: 18px;
        bottom: 24px;
        left: 17px;
        width: 2px;
        background-color: #d896a7;
        z-index: 1;
      }
    </style>
    <!-- END: Custom Styles -->
  </head>
  <body class="p-0 sm:p-4 antialiased selection:bg-pink-200">
    <!-- BEGIN: PhoneShellContainer -->
    <!-- Container simulating an iPhone display frame with soft pink gradient background -->
    <main
      class="w-full max-w-[390px] h-[844px] bg-[#FFF2F5] text-slate-800 rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative border-[7px] border-white"
    >
      <!-- BEGIN: iOSStatusBar -->
      <header class="pt-3 px-7 flex justify-between items-center z-20 shrink-0 text-slate-900 select-none">
        <!-- Time -->
        <span class="text-[14px] font-semibold tracking-tight">9:41</span>
        <!-- iOS Right Indicators (Signal, Wifi, Battery) -->
        <div class="flex items-center space-x-1.5">
          <!-- Cellular Signal -->
          <svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">

            <rect height="5" rx="0.6" width="2.5" x="4.5" y="6"></rect>
            <rect height="8" rx="0.6" width="2.5" x="9" y="3"></rect>
            <rect height="11" rx="0.6" width="2.5" x="13.5" y="0"></rect>
          </svg>
          <!-- WiFi -->

              d="M8 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4.5-4.2a6.3 6.3 0 0 0-9 0 .8.8 0 1 1-1.1-1.1 7.9 7.9 0 0 1 11.2 0 .8.8 0 0 1-1.1 1.1zm2.8-2.8a10.3 10.3 0 0 0-14.6 0 .8.8 0 1 1-1.1-1.1 11.9 11.9 0 0 1 16.8 0 .8.8 0 1 1-1.1 1.1z"

      </header>
      <!-- END: iOSStatusBar -->
      <!-- BEGIN: NavigationBar -->
      <nav class="relative px-5 pt-3 pb-2 flex items-center justify-between z-20 shrink-0">
        <!-- Back Chevron Button -->

          aria-label="Quay lại"

          type="button"

            <path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <!-- Screen Title with Heart -->
        <h1 class="text-[17px] font-bold text-[#3B1923] flex items-center gap-1.5 tracking-tight">
          Lịch trình gợi ý
          <!-- Tiny Outline Heart -->
          <svg
            class="w-4 h-4 text-[#8A2445] stroke-[2] stroke-current fill-none inline-block -mt-0.5"
            viewbox="0 0 24 24"

            <path
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"

          </svg>
        </h1>
        <!-- Top Right Favorite Heart -->
        <button
          aria-label="Yêu thích"
          class="p-1 -mr-1 text-slate-700 hover:text-pink-600 transition-colors"
          type="button"

          <svg class="w-5 h-5 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
            <path
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"

              stroke-linejoin="round"

          <!-- Inactive Tab: Bản đồ -->

          <!-- Inactive Tab: Chi tiết -->
          <button class="pb-2.5 text-slate-500 hover:text-slate-800 transition-colors">Chi tiết</button>
        </div>
      </div>

      <!-- BEGIN: ScrollableContent -->

                    <p class="text-[11.5px] text-slate-500 font-normal leading-normal mt-0.5">
                      Café · 90 phút · ~80.000đ
                    </p>

            </div>
            <!-- Content Column -->

              <time class="block font-bold text-[14px] text-slate-800 mb-1">16:00</time>
              <div class="flex items-center justify-between">
                <!-- Stop Summary Card -->
                <div class="flex items-center space-x-3 min-w-0">
                  <img
                    alt="Bảo tàng Mỹ thuật"
                    class="w-[52px] h-[52px] rounded-xl object-cover shrink-0 shadow-sm border border-white"

                  />

                    <h3 class="font-bold text-[13.5px] text-slate-800 tracking-tight leading-snug truncate">
                      Bảo tàng Mỹ thuật
                    </h3>
                    <p class="text-[11.5px] text-slate-500 font-normal leading-normal mt-0.5">
                      Chụp ảnh · 90 phút · ~40.000đ
                    </p>
                  </div>
                </div>
                <!-- Options Button (3 dots) -->
                <button
                  aria-label="Tùy chọn Bảo tàng Mỹ thuật"
                  class="p-1 text-slate-500 hover:text-slate-800 shrink-0"

                    <circle cx="5" cy="12" r="2"></circle>
                    <circle cx="12" cy="12" r="2"></circle>
                    <circle cx="19" cy="12" r="2"></circle>
                  </svg>
                </button>
              </div>
            </div>
          </article>
          <!-- Timeline Item 3: 18:00 Lẩu nướng Chú Tèo -->
          <article class="relative flex items-start space-x-3.5 z-10">
            <!-- Timeline Marker Circle -->
            <div class="w-8 flex flex-col items-center shrink-0 pt-0.5">
              <div class="w-4 h-4 rounded-full border-[3px] border-[#8C1D40] bg-[#FFF2F5] shadow-xs"></div>
            </div>
            <!-- Content Column -->
            <div class="flex-1 min-w-0 -mt-1">
              <time class="block font-bold text-[14px] text-slate-800 mb-1">18:00</time>
              <div class="flex items-center justify-between">

                  <img
                    alt="Lẩu nướng Chú Tèo"
                    class="w-[52px] h-[52px] rounded-xl object-cover shrink-0 shadow-sm border border-white"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuC__zerm1ITkBRWdwogQOc2BRU6ERB9tOyEHBr-Qm3MUQa6ezqK-C4AXkXgUHype_qz1rbfZ4_WEWa2tm7Dzw4-Oxpp4q6HatV0Y8M_HPrW7guJYabuE82sT5cl02jr7cRPauFc_LAchWw2oDizBElImGNgWxoYG13Ekko-zk7aBxIZGVs2rYFHrT1-MDonuoaNbsLGwFT7cu4BI5cEYz1UbDJCN3f0tlo4AD2jVER5"
                  />
                  <div class="truncate">
                    <h3 class="font-bold text-[13.5px] text-slate-800 tracking-tight leading-snug truncate">
                      Lẩu nướng Chú Tèo
                    </h3>
                    <p class="text-[11.5px] text-slate-500 font-normal leading-normal mt-0.5">
                      Ăn tối · 90 phút · ~300.000đ
                    </p>
                  </div>
                </div>
                <!-- Options Button (3 dots) -->
                <button
                  aria-label="Tùy chọn Lẩu nướng Chú Tèo"
                  class="p-1 text-slate-500 hover:text-slate-800 shrink-0"
                  type="button"
                >
                  <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
                    <circle cx="5" cy="12" r="2"></circle>
                    <circle cx="12" cy="12" r="2"></circle>
                    <circle cx="19" cy="12" r="2"></circle>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        </section>
        <!-- END: VerticalTimeline -->
        <!-- BEGIN: CostAndDurationSummary -->
        <section
          aria-label="Tổng kết chi phí và thời gian"
          class="bg-white/80 backdrop-blur-sm rounded-2xl p-3.5 border border-pink-100 shadow-xs"
        >
          <div class="flex justify-between items-baseline mb-2">
            <span class="text-[13px] font-medium text-slate-700">Tổng dự kiến</span>
            <span class="text-[15px] font-bold text-[#B01E44]">~ 420.000đ</span>
          </div>
          <div
            class="flex items-center space-x-5 text-slate-600 text-[12px] font-normal pt-1 border-t border-pink-50"
          >
            <!-- Time Duration -->
            <div class="flex items-center space-x-1.5">
              <svg class="w-4 h-4 text-slate-500 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3 2" stroke-linecap="round"></path>
              </svg>
              <span>6 giờ</span>
            </div>
            <!-- Total Distance -->
            <div class="flex items-center space-x-1.5">
              <!-- Road/Distance Path Icon -->
              <svg class="w-4 h-4 text-slate-500 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
                <path
                  d="M6 18a3 3 0 100-6 3 3 0 000 6zM18 12a3 3 0 100-6 3 3 0 000 6zM8.5 15.5l7-7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span>12.5 km</span>
            </div>
          </div>
        </section>
        <!-- END: CostAndDurationSummary -->
        <!-- BEGIN: ActionButton -->
        <div class="pt-1 pb-1">
          <button
            class="w-full py-3 bg-[#FF6F91] hover:bg-[#fa5b81] active:scale-[0.99] text-white font-medium text-[14.5px] rounded-full shadow-md shadow-pink-300/40 flex items-center justify-center space-x-1.5 transition-all duration-150"
            type="button"
          >
            <span>Lưu lịch trình</span>

      >
        <!-- Tab 1: Home -->
        <a class="flex flex-col items-center group w-14" href="#">
          <svg
            class="w-5 h-5 text-slate-400 group-hover:text-pink-500 stroke-[1.8] stroke-current fill-none transition-colors"
            viewbox="0 0 24 24"
          >
            <path
              d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"

        </a>
        <!-- Tab 2: Planner (Active) -->

          <div class="relative">
            <svg class="w-5 h-5 text-[#FF6F91] stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
              <path

            ></path>
          </svg>
          <span class="text-[10px] text-slate-400 group-hover:text-pink-500 font-medium mt-1">Explore</span>
        </a>
        <!-- Tab 4: Dates -->
        <a class="flex flex-col items-center group w-14" href="#">
          <svg
            class="w-5 h-5 text-slate-400 group-hover:text-pink-500 stroke-[1.8] stroke-current fill-none transition-colors"
            viewbox="0 0 24 24"
          >
            <rect height="18" rx="2" stroke-width="1.8" width="18" x="3" y="4"></rect>
            <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-width="1.8"></path>

          <svg
            class="w-5 h-5 text-slate-400 group-hover:text-pink-500 stroke-[1.8] stroke-current fill-none transition-colors"

            <rect height="16" rx="2" stroke-width="1.8" width="18" x="3" y="5"></rect>
            <path
